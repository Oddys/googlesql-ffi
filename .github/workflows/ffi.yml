name: ffi

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # Google's current reference platform for Linux is Ubuntu 22.04
        # MacOS runner is latest
        include:
          - { platform: macos_x86_64, runner: macos-26-intel }
          - { platform: macos_arm64, runner: macos-26 }
          - { platform: linux_x86_64, runner: ubuntu-22.04 }
          - { platform: linux_aarch64, runner: ubuntu-22.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ matrix.platform }}
          repository-cache: true
      - run: bazel test -c opt //googlesql/ffi:googlesql_parser_test
      - run: bazel build -c opt --platforms=//googlesql/ffi:${{ matrix.platform }} //googlesql/ffi:googlesql_parser
      - name: Package
        run: |
          d=googlesql_parser-${{ matrix.platform }}
          mkdir -p $d/lib $d/include
          cp bazel-bin/googlesql/ffi/libgooglesql_parser.a $d/lib/
          cp googlesql/ffi/googlesql_parser.h $d/include/
          tar -czf $d.tar.gz $d
      - uses: actions/upload-artifact@v7
        with:
          name: googlesql_parser-${{ matrix.platform }}
          path: googlesql_parser-${{ matrix.platform }}.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" *.tar.gz --draft --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
