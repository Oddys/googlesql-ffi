name: ffi

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # Google's current reference platform for Linux is Ubuntu 22.04
        # MacOS runner is latest
        include:
          - { platform: macos_x86_64, runner: macos-26-intel }
          - { platform: macos_arm64, runner: macos-26 }
          - { platform: linux_x86_64, runner: ubuntu-22.04 }
          - { platform: linux_aarch64, runner: ubuntu-22.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ matrix.platform }}
          repository-cache: true
      - run: bazel test -c opt //googlesql/ffi:googlesql_ffi_test
      - run: bazel build -c opt --platforms=//googlesql/ffi:${{ matrix.platform }} //googlesql/ffi:googlesql_ffi
      # Links a C program against just the .a and the header, the way as the library's consumers do
      - run: bazel test -c opt --platforms=//googlesql/ffi:${{ matrix.platform }} //googlesql/ffi:link_smoke_test
      - name: Package
        run: |
          d=googlesql_ffi_${{ matrix.platform }}
          mkdir -p $d/lib $d/include
          cp bazel-bin/googlesql/ffi/libgooglesql_ffi.a $d/lib/
          cp googlesql/ffi/googlesql_ffi.h $d/include/
          # A manifest makes `zig fetch` produce a named hash (<name>-<version>-...) instead of N-V-...
          cp googlesql/ffi/zig/${{ matrix.platform }}/build.zig.zon $d/
          # Tag build fails if the manifest version wasn't bumped to match the tag
          [[ $GITHUB_REF != refs/tags/v* ]] || grep -qF "\"${GITHUB_REF_NAME#v}\"" $d/build.zig.zon
          tar -czf $d.tar.gz $d
      - uses: actions/upload-artifact@v7
        with:
          name: googlesql_ffi_${{ matrix.platform }}
          path: googlesql_ffi_${{ matrix.platform }}.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" *.tar.gz --draft --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
